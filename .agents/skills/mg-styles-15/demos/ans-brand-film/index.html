// ------------------------------------------------------------------ 8. 3 Frosted-Glass Cards Setup & State Choreography
const S = 2; // 2x supersampled UI texture inside each frosted glass card
function makeCard(id, maxW, maxH) {
  const cv = document.createElement('canvas');
  cv.width = maxW * S;
  cv.height = maxH * S;
  return { id, maxW, maxH, w: maxW, h: maxH, cv, g: cv.getContext('2d'), tex: canvasTex(true) };
}

function prepareCardCanvas(card, st) {
  const tw = Math.max(64, Math.round(st.w * S));
  const th = Math.max(64, Math.round(st.h * S));
  if (card.cv.width !== tw || card.cv.height !== th) {
    card.cv.width = tw;
    card.cv.height = th;
  }
  const g = card.g;
  g.setTransform(S, 0, 0, S, 0, 0);
  g.clearRect(0, 0, st.w, st.h);
  const hdrGr = g.createLinearGradient(0, 0, 0, 118);
  hdrGr.addColorStop(0, 'rgba(6, 10, 22, 0.38)');
  hdrGr.addColorStop(0.65, 'rgba(6, 10, 22, 0.16)');
  hdrGr.addColorStop(1, 'rgba(6, 10, 22, 0)');
  g.fillStyle = hdrGr;
  g.fillRect(0, 0, st.w, 118);
  return g;
}

const CARDS = [
  makeCard('L', 740, 560),
  makeCard('M', 1420, 760),
  makeCard('R', 740, 560),
];

function getCardState(idx, t, tReal) {
  const ch = getChapterIndex(tReal);
  const [r0, r1] = TL.chapters[ch] || [0, 14.3];
  const local = tReal - r0;
  const dur = Math.max(0.1, r1 - r0);

  let x = 960, y = 570, z = 0, rx = 0, ry = 0, rz = 0;
  let w = 520, h = 540, r = 36, op = 1, frost = 1.0, defocus = 0.5;
  const flY = Math.sin(tReal * 1.45 + idx * 1.7) * 4.0;
  const flRx = Math.cos(tReal * 1.10 + idx * 1.3) * 0.75;
  const flRy = Math.sin(tReal * 0.92 + idx * 2.1) * 0.95;

  // CHAPTER 0 (0.00s .. 14.31s): Pain Point (Clauses 0) -> Flip to Day 01 Three Real Things (Clause 1)
  if (ch === 0) {
    const in1 = seg(tReal, 0.0, 0.70, eOutBack);
    const flipU = clamp((tReal - 6.15) / 0.85);
    const flip = eInOutCubic(flipU);
    const flipSwing = Math.sin(flipU * Math.PI);
    const out1 = seg(tReal, r1 - 0.42, r1, eInOutCubic);

    if (idx === 0) {
      w = 450; h = 496; r = 34;
      x = lerp(310, 315, flip) - 160 * (1 - in1) - 180 * out1;
      y = lerp(555, 540, flip) + 30 * (1 - in1) + flY;
      z = lerp(90, 80, flip) - 45 * flipSwing + 180 * out1;
      rx = lerp(4, 2, flip) + 4 * flipSwing + flRx;
      ry = lerp(16, 15, flip) + 22 * flipSwing + flRy;
      defocus = lerp(0.8, 0.5, flip) + 4 * (1 - in1) + 6 * out1;
      op = clamp(in1, 0, 1) * (1 - 0.85 * out1);
    } else if (idx === 1) {
      w = 700; h = 516; r = 38;
      x = 960;
      y = lerp(555, 536, flip) + 35 * (1 - in1) + flY * 0.7;
      z = lerp(20, -15, flip) - 55 * flipSwing + 140 * out1;
      rx = lerp(3, 1, flip) + 5 * flipSwing + flRx * 0.6;
      ry = 18 * flipSwing + flRy * 0.6;
      defocus = 0.5 + 3 * (1 - in1) + 5 * out1;
      op = clamp(in1, 0, 1) * (1 - 0.85 * out1);
    } else {
      w = 450; h = 496; r = 34;
      x = lerp(1610, 1605, flip) + 160 * (1 - in1) + 180 * out1;
      y = lerp(555, 540, flip) + 30 * (1 - in1) + flY;
      z = lerp(90, 80, flip) - 45 * flipSwing + 180 * out1;
      rx = lerp(4, 2, flip) + 4 * flipSwing + flRx;
      ry = lerp(-16, -15, flip) - 22 * flipSwing + flRy;
      defocus = lerp(0.8, 0.5, flip) + 4 * (1 - in1) + 6 * out1;
      op = clamp(in1, 0, 1) * (1 - 0.85 * out1);
    }
  }
  // CHAPTERS 1 .. 6 (14.31s .. 108.76s): Widescreen Live Browser Studio in CARDS[1] + Floating Side HUD Cards in CARDS[0] & CARDS[2]
  else if (ch >= 1 && ch <= 6) {
    const inC = seg(local, 0.0, 0.62, eOutBack);
    const outC = seg(local, dur - 0.36, dur, eInOutCubic);
    const swing = Math.sin(clamp(local / 0.62) * Math.PI);

    if (idx === 1) {
      w = 1360; h = 736; r = 30;
      x = 960;
      y = 556 + 26 * (1 - inC) + flY * 0.45;
      z = -28 - 35 * swing + 110 * (1 - inC) + 110 * outC;
      rx = 0.6 + 2.5 * swing + flRx * 0.35;
      ry = -6 * swing + flRy * 0.35;
      op = clamp(inC, 0, 1) * (1 - 0.45 * outC);
      defocus = 0.4 + 3 * Math.max(0, 1 - inC) + 3 * outC;
    } else if (idx === 0) {
      w = 224; h = 460; r = 26;
      x = 142 - 90 * (1 - inC) - 90 * outC;
      y = 556 + flY;
      z = 45;
      rx = 2 + flRx;
      ry = 16 + flRy;
      op = clamp(inC, 0, 1) * (1 - outC) * 0.94;
      defocus = 0.6;
    } else {
      w = 224; h = 460; r = 26;
      x = 1778 + 90 * (1 - inC) + 90 * outC;
      y = 556 + flY;
      z = 45;
      rx = 2 + flRx;
      ry = -16 + flRy;
      op = clamp(inC, 0, 1) * (1 - outC) * 0.94;
      defocus = 0.6;
    }
  }
  // CHAPTER 7 (108.76s .. 121.96s): 28-Day Flag Dual Cards (Clause 15) -> Morph Curtain Parting into Giant "ANS" Finale (Clause 16)
  else {
    const in4 = seg(t, 11.50, 12.10, eOutBack);
    const part = seg(t, 12.95, 13.75, eInOutCubic);
    if (idx === 0) {
      w = 740; h = 528; r = 38;
      x = 545 - 240 * (1 - in4) - 720 * part;
      y = 565 + 40 * (1 - in4) + flY;
      z = 15 + 180 * (1 - in4) - 360 * part;
      rx = 2 + flRx + 6 * part;
      ry = 8 + flRy + 16 * part;
      op = clamp(in4, 0, 1) * (1 - seg(t, 13.30, 13.70));
      defocus = 0.5 + 14 * part;
    } else if (idx === 2) {
      w = 740; h = 528; r = 38;
      x = 1375 + 240 * (1 - in4) + 720 * part;
      y = 565 + 40 * (1 - in4) + flY;
      z = 15 + 180 * (1 - in4) - 360 * part;
      rx = 2 + flRx + 6 * part;
      ry = -8 + flRy - 16 * part;
      op = clamp(in4, 0, 1) * (1 - seg(t, 13.30, 13.70));
      defocus = 0.5 + 14 * part;
    } else {
      op = 0;
    }
  }

  const R = rotM(rx, ry, rz);
  const sheen = -0.65 + 1.3 * ((tReal * 0.16 + idx * 0.31) % 1) + ry * 0.035;
  const glintPhase = (tReal * 0.32 + idx * 0.27) % 1;
  const glint = [lerp(-1.8, 1.8, glintPhase), 0.14 * Math.sin(glintPhase * Math.PI)];
  return {
    C: [x, y, z], ...R, half: [w / 2, h / 2], w, h, r,
    op: clamp(op, 0, 1), contentA: 1.0, lod: 0.25 * Math.max(0, defocus - 0.5),
    frost, defocus, sheen, glint, edge: 1.25,
    catchL: [Math.sin(tReal * 1.6 + idx) * 0.4, 0.08]
  };
}

const CANON_MAP = [
  [0.00, 0.72, 2.94, 3.20, 0.75, 0.36], // ch0
  [3.20, 3.90, 5.10, 5.25, 0.65, 0.25], // ch1
  [5.25, 5.85, 7.00, 7.20, 0.65, 0.25], // ch2

  [10.80, 11.00, 11.20, 11.35, 0.65, 0.25], // ch5
  [11.35, 11.40, 11.45, 11.50, 0.65, 0.25], // ch6
  [11.50, 12.15, 14.95, 15.00, 0.75, 0.25], // ch7
];

function mapRealToCanon(tReal) {
  const chs = TL.chapters;
  if (!chs || !chs.length) return clamp(tReal, 0, 15.0);
  const ch = getChapterIndex(tReal);
  const [r0, r1] = chs[ch];
  if (ch === 7) {
    // Clause 15 (108.76..115.66s) shows the Dual 28-Day Flag Cards (t=11.5..12.95)
    // Clause 16 (115.66..121.96s) parts the curtains and morphs the giant "ANS" monument (t=12.95..15.0)
    if (tReal < 115.50) {
      const u = clamp((tReal - r0) / Math.max(0.1, 115.50 - r0));
      return lerp(11.50, 12.92, u);
    } else {
      const u = clamp((tReal - 115.50) / Math.max(0.1, r1 - 115.50));
      return lerp(12.95, 15.00, u);
    }
  }
  const [cIn0, cHold0, cHold1, cOut1, inReal, outReal] = CANON_MAP[ch];
  const dur = Math.max(0.1, r1 - r0);
  const local = clamp(tReal - r0, 0, dur);
  if (local <= inReal) return lerp(cIn0, cHold0, local / inReal);
  if (local <= dur - outReal) return lerp(cHold0, cHold1, (local - inReal) / Math.max(0.1, dur - inReal - outReal));
  return lerp(cHold1, cOut1, (local - (dur - outReal)) / outReal);
}

      og.globalAlpha = subA.a;
      const sy = 626 + subA.dy;
      og.shadowColor = 'rgba(4, 6, 24, 0.65)';
      og.shadowBlur = 16;
      og.shadowOffsetY = 3;

      const cx = 772;
      og.font = `700 42px ${F_DISP}`;
      const txt1 = 'AI Never Stops';
      const w1 = og.measureText(txt1).width;

      og.font = `600 28px ${F_MONO}`;
      const txt2 = 'https://ans.cauai.fun';
      const w2 = og.measureText(txt2).width;

      const logoW = 44;
      const gap = 22;
      const tot = logoW + 14 + w1 + gap * 2 + 2 + w2;
      const x0 = cx - tot / 2;

      drawAnsLogo(og, x0 + logoW / 2, sy - 14, 38, 'mint', { glow: true });

      const tx1 = x0 + logoW + 14;
      og.font = `700 42px ${F_DISP}`;
      og.fillStyle = WHITE(0.98);
      og.textAlign = 'left';
      og.fillText(txt1, tx1, sy);

      og.fillStyle = WHITE(0.42);
      og.fillRect(Math.round(tx1 + w1 + gap), sy - 32, 2, 38);

      og.font = `600 28px ${F_MONO}`;
      og.fillStyle = '#9BE0C5';
      og.fillText(txt2, tx1 + w1 + gap * 2 + 2, sy - 3);

      const barW = 860, barH = 62, barX = cx - barW / 2, barY = 684 + subA.dy;
      rr(og, barX, barY, barW, barH, 31);
      og.fillStyle = 'rgba(10, 18, 32, 0.58)'; og.fill();
      og.strokeStyle = 'rgba(255, 255, 255, 0.30)'; og.lineWidth = 1.4; og.stroke();

      rr(og, barX + 10, barY + 9, 272, 44, 22);
      const pillGr = og.createLinearGradient(barX + 10, 0, barX + 282, 0);
      pillGr.addColorStop(0, '#9BE0C5');
      pillGr.addColorStop(1, '#38BDF8');
      og.fillStyle = pillGr; og.fill();

      og.shadowBlur = 0; og.shadowOffsetY = 0;
      drawAnsLogo(og, barX + 38, barY + 31, 22, 'dark');
      og.font = `700 15.5px ${F_UI}`;
      og.fillStyle = '#041016';
      og.textAlign = 'left';
      og.fillText('Day 01 / 28 正式上线 →', barX + 56, barY + 36);

      og.font = `600 14.2px ${F_UI}`;
      og.fillStyle = WHITE(0.96);
      og.fillText('项目广场  ·  VibeHub  ·  3D 小恐龙 Agent  ·  创作者市场  ·  农客松与 CAUHub', barX + 298, barY + 36);
      og.restore();
    }

    const mA = seg(t, 13.15, 13.75, eOutBack);
    if (mA > 0.01) {
      const mCX = 1485, mCY = 495;
      og.save();
      og.globalAlpha = clamp(mA, 0, 1);
      og.translate(mCX, mCY);
      og.scale(mA, mA);

      const ringGr = og.createRadialGradient(0, 0, 40, 0, 0, 175);
      ringGr.addColorStop(0, 'rgba(155, 224, 197, 0.28)');
      ringGr.addColorStop(0.65, 'rgba(52, 207, 240, 0.12)');
      ringGr.addColorStop(1, 'rgba(52, 207, 240, 0)');
      og.fillStyle = ringGr;
      og.beginPath(); og.arc(0, 0, 175, 0, TAU); og.fill();

      og.strokeStyle = 'rgba(255, 255, 255, 0.28)';
      og.lineWidth = 1.6;
      og.beginPath(); og.arc(0, 0, 148, 0, TAU); og.stroke();

      drawMascot(og, 0, 6, 268, t, { bobAmp: 4.0 });

      drawGlassChip(og, -148, 158, 296, 36, '● 28 天每日有感改进  ·  否则全员额度重置', {
        bg: 'rgba(10, 18, 32, 0.72)', stroke: 'rgba(155, 224, 197, 0.55)', color: '#9BE0C5', font: `600 13px ${F_UI}`
      });
      og.restore();
    }
  }

  // Always render the pure single-line verbatim subtitle bar at bottom
  drawSubtitleBar(og, tReal);

  return hasGlyphMask;
}

// ------------------------------------------------------------------ 11. 7-Wavelength Spectral Refractive Liquid-Glass Lens (FS_LENS)
function getLensState(t) {
  if (t >= 13.05) {
    const on = seg(t, 13.05, 13.45);
    const rk = seg(t, 13.25, 13.75, eOutCubic);
    const R = ANS_MORPH.ringR;
    const ringW = lerp(R * 1.1, 14, rk);
    const kw = inv(13.2, 14.4, t);
    return {
      on, c: [ANS_MORPH.ringX, ANS_MORPH.ringY], hx: R, hy: R, r: R, M: [1, 0, 0, 1],
      bead: [0, 0, 0], beadK: 0, beadA: 0,
      lift: 0.25, mag: 1.22, bezel: Math.min(R * 0.55, ringW * 0.5), ringW, warm: 0.25, cw: 0.16,
      rgl: [lerp(-2.4, 1.2, inv(13.4, 14.6, t)), 0.95],
      wave: [720 * eOutSine(kw), 0.09 * (1 - kw), 4.5 * (1 - kw)]
    };
  }
  return { on: 0 };
}

// ------------------------------------------------------------------ 12. Master Deterministic Frame Renderer: window.renderAt(t) & window.__seek(t)
async function renderFrame(tRealInput) {
  const tReal = clamp(tRealInput, 0, DUR);
  window.__tReal = tReal;
  const t = mapRealToCanon(tReal);
  const frame = Math.round(tReal * FPS * 4);
  const cam = cameraAt(t, tReal);
  const O = camO(cam);
  const states = [0, 1, 2].map(i => ({ c: CARDS[i], s: getCardState(i, t, tReal), idx: i }));

  if (states[0].s.op > 0.001) { drawCardL(CARDS[0], t, states[0].s, tReal); upload(CARDS[0].tex, CARDS[0].cv, true); }
  if (states[1].s.op > 0.001) { drawCardM(CARDS[1], t, states[1].s, tReal); upload(CARDS[1].tex, CARDS[1].cv, true); }
  if (states[2].s.op > 0.001) { drawCardR(CARDS[2], t, states[2].s, tReal); upload(CARDS[2].tex, CARDS[2].cv, true); }

  {
    const L = use(P.aurora, T.sceneA);
    const tAurora = tReal * 0.35;
    gl.uniform1f(L.uT, tAurora);
    const blobs = new Float32Array(4 * BLOBS.length);
    const blobE = new Float32Array(2 * BLOBS.length);
    const cols = new Float32Array(3 * BLOBS.length);
    BLOBS.forEach((b, i) => {
      const p = b.path(tAurora);
      blobs.set([p[0] - cam.x * 0.35, p[1] - cam.y * 0.35, b.rx, b.i], i * 4);
      blobE.set([b.ry, b.ang * D2R + 0.08 * Math.sin(tAurora * 0.3 + i)], i * 2);
      cols.set(hex(b.col), i * 3);
    });
    gl.uniform4fv(L.uBlob, blobs);
    gl.uniform2fv(L.uBlobE, blobE);
    gl.uniform3fv(L.uBlobC, cols);

    let rip = [960, 540, 0, 0];
    if (tReal < 2.2) {
      const k = inv(0.3, 2.1, tReal);
      rip = [960, 540, 60 + 1400 * eOutSine(k), (1 - k) * 1.1];
    } else if (t >= 13.0) {
      const k = inv(13.0, 14.8, t);
      rip = [ANS_MORPH.centerX, 490, 60 + 1450 * eOutSine(k), (1 - k) * 1.25];
    }
    gl.uniform4fv(L.uRipple, rip);
    gl.uniform3fv(L.uBase, hex(PAL.base));
    gl.uniform1f(L.uGain, 0.96 + 0.06 * seg(t, 13.0, 14.5));
    gl.uniform1f(L.uWarp, 145);
    gl.uniform3fv(L.uCamO, O);
    gl.uniform1f(L.uF, F_LEN);

    const SC = [], SU = [], SV = [], SN = [], SH = [];
    states.forEach(({ s }) => {
      SC.push(...s.C); SU.push(...s.U); SV.push(...s.V); SN.push(...s.N);
      SH.push(s.half[0], s.half[1], s.r, s.op);
    });
    gl.uniform3fv(L.uSC, SC); gl.uniform3fv(L.uSU, SU); gl.uniform3fv(L.uSV, SV); gl.uniform3fv(L.uSN, SN); gl.uniform4fv(L.uSH, SH);
    gl.uniform1f(L.uMotes, 1.0);
    draw();
  }

  let cur = T.sceneA;

  const hasGlyph = drawForegroundAndGlyphs(t, tReal);
  if (hasGlyph) {
    upload(glyphTex, glyphCv, false);
    let L = use(P.blur, T.g1); bindTex(0, glyphTex, L.uSrc); gl.uniform2f(L.uDir, 1, 0); gl.uniform1fv(L.uOff, TAPS_GN.offs); gl.uniform1fv(L.uW, TAPS_GN.ws); gl.uniform1i(L.uN, TAPS_GN.n); draw();
    L = use(P.blur, T.g2); bindTex(0, T.g1.tex, L.uSrc); gl.uniform2f(L.uDir, 0, 1); gl.uniform1fv(L.uOff, TAPS_GN.offs); gl.uniform1fv(L.uW, TAPS_GN.ws); gl.uniform1i(L.uN, TAPS_GN.n); draw();
    blurInto({ tex: glyphTex, w: RW, h: RH }, T.qL, TAPS_GW);
    blurInto(cur, T.qB, TAPS_GF);

    L = use(P.glyph, T.sceneB);
    bindTex(0, cur.tex, L.uScene);
    bindTex(1, T.qB.tex, L.uFrost);
    bindTex(2, glyphTex, L.uMask);
    bindTex(3, T.g2.tex, L.uMN);
    bindTex(4, T.qL.tex, L.uMW);
    gl.uniform2f(L.uLight, -0.55, -0.83);
    gl.uniform1f(L.uRefr, 34.0);
    gl.uniform3f(L.uShadow, 6, 12, 0.38);
    gl.uniform1f(L.uLift, 0.075);
    const pk = 0.88 * seg(t, 13.0, 13.8);
    gl.uniform4f(L.uPool, ANS_MORPH.centerX + 20, 480, 500, 210);
    gl.uniform3f(L.uPoolK, pk, 170, 240);
    gl.uniform3f(L.uHalo, 0.36, 1.02, 1.32);
    gl.uniform1f(L.uSat, 1.38);
    const ks = inv(13.5, 14.6, t);
    gl.uniform3f(L.uSweep, lerp(-580, 580, eInOutCubic(ks)), 80, ks > 0 && ks < 1 ? 0.38 * Math.sin(Math.PI * ks) : 0);
    draw();
    cur = T.sceneB;
  }

  const order = states.filter(({ s }) => s.op > 0.001).sort((a, b) => (b.s.C[2] - a.s.C[2]));
  for (const { c, s } of order) {
    blurInto(cur, T.qB, TAPS_FROST);
    const L = use(P.card, cur);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform3fv(L.uCamO, O);
    gl.uniform1f(L.uF, F_LEN);
    gl.uniform3fv(L.uC, s.C);
    gl.uniform3fv(L.uU, s.U);
    gl.uniform3fv(L.uV, s.V);
    gl.uniform3fv(L.uN, s.N);
    gl.uniform2f(L.uHalf, s.half[0], s.half[1]);
    gl.uniform1f(L.uRad, s.r);
    gl.uniform1f(L.uOpacity, s.op);
    gl.uniform1f(L.uDefocus, s.defocus);
    gl.uniform1f(L.uContentA, s.contentA);
    gl.uniform1f(L.uLod, s.lod);
    gl.uniform1f(L.uFrost, s.frost);
    gl.uniform2f(L.uLight, -0.55, -0.83);
    gl.uniform1f(L.uSheen, s.sheen);
    gl.uniform2f(L.uGlint, s.glint[0], s.glint[1]);
    gl.uniform1f(L.uEdge, s.edge);
    gl.uniform2f(L.uCatch, s.catchL[0], s.catchL[1]);
    bindTex(0, T.qB.tex, L.uBlurTex);
    bindTex(1, c.tex, L.uContent);
    draw();
    gl.disable(gl.BLEND);
  }

  upload(overTex, overCv, false);
  {
    const L = use(P.over, cur);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    bindTex(0, overTex, L.uTex);
    gl.uniform1f(L.uA, 1.0);
    draw();
    gl.disable(gl.BLEND);
  }

  const lens = getLensState(t);
  blurInto(cur, T.qL, TAPS_LENS);
  {
    const L = use(P.lens, T.lens);
    bindTex(0, cur.tex, L.uScene);
    bindTex(1, T.qL.tex, L.uBlur);
    gl.uniform1f(L.uOn, lens.on || 0);
    if (lens.on > 0) {
      gl.uniform2f(L.uLC, lens.c[0], lens.c[1]);
      gl.uniform2f(L.uLH, lens.hx, lens.hy);
      gl.uniform1f(L.uLR, lens.r);
      gl.uniformMatrix2fv(L.uLM, false, new Float32Array(lens.M));
      gl.uniform3f(L.uBead, lens.bead[0], lens.bead[1], lens.bead[2]);
      gl.uniform1f(L.uBeadK, lens.beadK);
      gl.uniform1f(L.uBeadA, lens.beadA);
      gl.uniform1f(L.uBezel, lens.bezel);
      gl.uniform1f(L.uDepth, lens.bezel * 0.9);
      gl.uniform1f(L.uIor, 1.5);
      gl.uniform1f(L.uDisp, 0.22);
      gl.uniform1f(L.uMag, lens.mag);
      gl.uniform1f(L.uRefrSign, -1);
      gl.uniform1f(L.uMaxDisp, lens.bezel * 0.85);
      gl.uniform1f(L.uRimGlow, 1.8);
      gl.uniform1f(L.uRing, 0.38);
      if (L.uHide) gl.uniform1f(L.uHide, 0);
      gl.uniform1f(L.uRingW, lens.ringW);
      gl.uniform1f(L.uWarm, lens.warm);
      gl.uniform1f(L.uCW, lens.cw);
      gl.uniform2f(L.uRGl, lens.rgl[0], lens.rgl[1]);
      gl.uniform3f(L.uWave, lens.wave[0], lens.wave[1], lens.wave[2]);
      gl.uniform1f(L.uCaustic, 0.22 * lens.lift);
      gl.uniform1f(L.uLift, lens.lift);
      gl.uniform1f(L.uGlint, lerp(-1.8, 1.8, (tReal * 0.35) % 1));
      gl.uniform3f(L.uLight3, -0.5, -0.78, 0.62);
      gl.uniform1f(L.uFrostRim, 0.10);
      gl.uniform1f(L.uFres, 0.25);
      gl.uniform1f(L.uBzExp, 2.5);
    }
    draw();
  }

  blurInto(T.lens, T.qB, TAPS_BLOOM, 0.62);
  {
    const L = use(P.final, null);
    bindTex(0, T.lens.tex, L.uSrc);
    bindTex(1, T.qB.tex, L.uBloom);
    bindTex(2, grainTex, L.uGrain);
    gl.uniform1f(L.uBloomAmt, 0.20);
    gl.uniform1f(L.uGrainAmt, 0.08);
    gl.uniform1f(L.uFrame, frame);
    gl.uniform1f(L.uVig, 0.18);
    gl.uniform1f(L.uFade, 1.0);
    draw();
  }
  gl.finish();
}

window.renderAt = renderFrame;
window.__seek = renderFrame;

await renderFrame(2.5);
window.__ready = true;
</script>
